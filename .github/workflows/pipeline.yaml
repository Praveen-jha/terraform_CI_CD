name: CI-CD PIPELINE (Debug + Format)

on:
  push:
    branches: [ praveen ]
  pull_request:
    branches: [ praveen ]
  workflow_dispatch:

env:
  TF_WORKING_DIR: terraform   # change this to the folder name that contains your .tf files

jobs:
  debug-and-format:
    name: Debug repo layout and run terraform fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print current working dir and list repo root
        run: |
          echo "Runner working dir: $(pwd)"
          echo "Listing top-level files and folders:"
          ls -la

      - name: Show nested path where runner expects the repo
        run: |
          echo "Full path where repo is checked out:"
          echo "/home/runner/work/${{ github.repository_name }}/${{ github.repository_name }}"
          echo "Listing that path (if exists):"
          ls -la "/home/runner/work/${{ github.repository_name }}/${{ github.repository_name }}" || true

      - name: List TF_WORKING_DIR resolved path
        run: |
          echo "TF_WORKING_DIR = '${{ env.TF_WORKING_DIR }}'"
          echo "Checking if folder exists:"
          if [ -d "${{ env.TF_WORKING_DIR }}" ]; then
            echo "Folder '${{ env.TF_WORKING_DIR }}' exists. Listing contents:"
            ls -la "${{ env.TF_WORKING_DIR }}"
          else
            echo "Folder '${{ env.TF_WORKING_DIR }}' does NOT exist at repo root."
            echo "Did you place your Terraform files in a different folder?"
            echo "Current repo layout (again):"
            ls -la
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: Terraform fmt (check)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive
